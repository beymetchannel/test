<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEYカレンダー</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 440px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .logo-area {
            font-size: 2.5rem;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.025em;
        }
        p {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 12px;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
        }
        .btn:hover {
            background-color: var(--accent-hover);
        }
        .btn:active {
            transform: scale(0.98);
        }
        .guide-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            text-align: left;
        }
        .guide-box h3 {
            font-size: 0.9rem;
            color: var(--accent);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .guide-box ol {
            padding-left: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        .guide-box li {
            margin-bottom: 4px;
        }
        .hidden {
            display: none !important;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-area">🚀</div>
        <div id="status-badge" class="status-badge">Secure Redirect</div>
        <h1 id="title-text">外部ブラウザでの閲覧を推奨しています</h1>
        <p id="desc-text">アプリ内ブラウザによるログイン破綻や表示崩れを防ぎ、最高のパフォーマンスでコンテンツを表示するための専用中継ページです。</p>

        <!-- Android専用アクション -->
        <div id="android-section" class="hidden">
            <a id="android-btn" href="#" class="btn">Chromeアプリで開く</a>
        </div>

        <!-- iOS (iPhone) 専用ガイド -->
        <div id="ios-section" class="hidden">
            <a id="safari-btn" href="#" class="btn">リンクをコピーしてSafariを開く</a>
            <div class="guide-box">
                <h3>💡 Safariで開く手順</h3>
                <ol>
                    <li>右下のメニューアイコン（<strong>…</strong> または <strong>共有ボタン</strong>）をタップ</li>
                    <li><strong>「Safariで開く」</strong>を選択してください</li>
                </ol>
            </div>
        </div>

        <!-- 通常ブラウザ用 -->
        <div id="default-section" class="hidden">
            <a id="direct-btn" href="#" class="btn">コンテンツへ進む</a>
        </div>
    </div>

    <script>
        // 遷移先のURL（ここにあなたの目的のURLを設定してください）
        const targetUrl = "https://beymetchannel.github.io/BeyCalendar/"; 

        const ua = navigator.userAgent.toLowerCase();
        const isAndroid = ua.indexOf("android") > -1;
        const isIOS = /iphone|ipad|ipod/.test(ua);

        const androidSection = document.getElementById("android-section");
        const iosSection = document.getElementById("ios-section");
        const defaultSection = document.getElementById("default-section");
        const androidBtn = document.getElementById("android-btn");
        const safariBtn = document.getElementById("safari-btn");
        const directBtn = document.getElementById("direct-btn");
        const statusBadge = document.getElementById("status-badge");

        directBtn.href = targetUrl;

        if (isAndroid) {
            statusBadge.textContent = "Android Environment Detected";
            androidSection.classList.remove("hidden");
            // Android Intent URLの生成で直接Chromeを直撃
            const cleanUrl = targetUrl.replace(/^https?:\/\//, '');
            androidBtn.href = `intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;`;
        } else if (isIOS) {
            statusBadge.textContent = "iOS Environment Detected";
            iosSection.classList.remove("hidden");
            
            // クリップボードコピーの動作でスムーズに移行
            safariBtn.addEventListener("click", function(e) {
                e.preventDefault();
                navigator.clipboard.writeText(targetUrl).then(() => {
                    safariBtn.textContent = "URLをコピーしましたSafariへ移動してね";
                    safariBtn.style.backgroundColor = "#10b981";
                    safariBtn.style.color = "#ffffff";
                }).catch(err => {
                    window.location.href = targetUrl;
                });
            });
        } else {
            statusBadge.textContent = "Standard Browser";
            defaultSection.classList.remove("hidden");
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 800);
        }
    </script>
</body>
</html>
