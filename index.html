<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ジャッジ討伐 受付状況</title>
<style>
  :root {
    --dran-color: #6FC3E6;
    --hells-color: #FF9797;
    --rare-color: #93A8DD;
    --wizard-color: #FFE800;
    --knight-color: #B3EE8A;
    --gray-bg: #C9C9C9;
    --gray-font: #8A8A8A;
    --gray-icon-opacity: 0.35;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #ffffff;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    overflow: hidden;
  }

  .screen {
    width: 100vw;
    height: 100vh;
    padding: 2.2vh 2.2vw;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 2vh 2.2vw;
  }

  .title {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.15;
    font-weight: 900;
    font-size: 4.6vh;
    color: #111111;
    letter-spacing: 0.02em;
  }

  .status-btn {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    border: none;
    border-radius: 1.6vh;
    padding: 0 3vw;
    cursor: pointer;
    width: 100%;
    height: 100%;
    transition: background-color 0.25s ease;
    box-shadow: 0 0.4vh 0 rgba(0,0,0,0.08);
  }

  .status-btn .icon {
    height: 65%;
    width: auto;
    max-width: 30%;
    object-fit: contain;
    transition: opacity 0.25s ease;
    flex-shrink: 0;
  }

  .status-btn .label {
    font-weight: 900;
    color: #111111;
    font-size: 5vh;
    white-space: nowrap;
    transition: color 0.25s ease, font-size 0.25s ease;
  }

  /* トーナメント中（受付停止）状態：グレー */
  .status-btn.tournament {
    background-color: var(--gray-bg);
  }
  .status-btn.tournament .icon {
    opacity: var(--gray-icon-opacity);
  }
  .status-btn.tournament .label {
    color: var(--gray-font);
    font-size: 5vh;
  }

  /* 受付中！状態：カラー＋文字拡大 */
  .status-btn.open .icon {
    opacity: 1;
  }
  .status-btn.open .label {
    color: #111111;
    font-size: 6.6vh;
  }

  .status-btn.open[data-name="dran"]   { background-color: var(--dran-color); }
  .status-btn.open[data-name="hells"]  { background-color: var(--hells-color); }
  .status-btn.open[data-name="rare"]   { background-color: var(--rare-color); }
  .status-btn.open[data-name="wizard"] { background-color: var(--wizard-color); }
  .status-btn.open[data-name="knight"] { background-color: var(--knight-color); }

</style>
</head>
<body>

<div class="screen">
  <div class="title">ジャッジ討伐<br>受付状況</div>
  <button class="status-btn tournament" data-name="rare">
    <img class="icon" src="Image/Rare.png" alt="紺">
    <span class="label">トーナメント中</span>
  </button>

  <button class="status-btn tournament" data-name="dran">
    <img class="icon" src="Image/Dran.png" alt="青">
    <span class="label">トーナメント中</span>
  </button>
  <button class="status-btn tournament" data-name="wizard">
    <img class="icon" src="Image/Wizard.png" alt="黄">
    <span class="label">トーナメント中</span>
  </button>

  <button class="status-btn tournament" data-name="hells">
    <img class="icon" src="Image/Hells.png" alt="赤">
    <span class="label">トーナメント中</span>
  </button>
  <button class="status-btn tournament" data-name="knight">
    <img class="icon" src="Image/Knight.png" alt="黄緑">
    <span class="label">トーナメント中</span>
  </button>
</div>

<script>
  const buttons = document.querySelectorAll('.status-btn');

  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      const label = btn.querySelector('.label');
      const isOpen = btn.classList.contains('open');

      if (isOpen) {
        btn.classList.remove('open');
        btn.classList.add('tournament');
        label.textContent = 'トーナメント中';
      } else {
        btn.classList.remove('tournament');
        btn.classList.add('open');
        label.textContent = '受付中！';
      }
    });
  });
</script>

</body>
</html>
